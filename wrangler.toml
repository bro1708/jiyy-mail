name = "jiyy-mail"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Frontend statis dari folder public/.
# Hanya /api/* yang lewat Worker, sisanya langsung disajikan sebagai aset.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DOMAIN = "jiyy.dev"
TTL_MINUTES = "60"          # email otomatis dihapus setelah sekian menit
MAX_EMAIL_BYTES = "1048576" # tolak email > 1 MB

[[d1_databases]]
binding = "DB"
database_name = "jiyy-mail"
database_id = "ISI_DENGAN_ID_D1_KAMU"

# Cleanup otomatis tiap 10 menit
[triggers]
crons = ["*/10 * * * *"]
